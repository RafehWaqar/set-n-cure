<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Set &amp; Cure</title>
<link rel="stylesheet" href="styles.css">
<script src="https://kit.fontawesome.com/e495167b3d.js" crossorigin="anonymous"></script>
</head>
<body>

<div data-header></div>

<main>
  <section class="page-hero wrap accounts-page">
    <span class="eyebrow">Your account</span>
    <h1 data-title>My account</h1>
    <p data-subtitle>Log in to track orders and check out faster next time.</p>
  </section>

  <section class="section wrap" data-account-root>
    <!-- filled by JS -->
  </section>
</main>

<div data-footer></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(async function(){
  renderHeader();
  renderFooter();
 
  const params = new URLSearchParams(location.search);
  const nextUrl = params.get("next") || "index.html";
  const root = document.querySelector("[data-account-root]");
 
  function authTabsHTML(showGuestOption){
    return `
      <div class="auth-panel">
        <div class="account-tabs">
          <button class="active" data-tab="login">Log in</button>
          <button data-tab="signup">Create account</button>
        </div>
 
        <div data-panel-login>
          <div class="form-error" data-login-error></div>
          <form data-login-form>
            <div class="field">
              <label for="login-email">Email</label>
              <input id="login-email" type="email" required>
            </div>
            <div class="field">
              <label for="login-password">Password</label>
              <input id="login-password" type="password" required>
            </div>
            <button type="submit" class="btn btn-primary loginbtn" style="width:100%;">Log in</button>
          </form>
        </div>
 
        <div data-panel-signup style="display:none;">
          <div class="form-error" data-signup-error></div>
          <form data-signup-form>
            <div class="field">
              <label for="signup-name">Full name</label>
              <input id="signup-name" required>
            </div>
            <div class="field">
              <label for="signup-email">Email</label>
              <input id="signup-email" type="email" required>
            </div>
            <div class="field">
              <label for="signup-password">Password</label>
              <input id="signup-password" type="password" required minlength="4">
            </div>
            <button type="submit" class="btn btn-primary loginbtn" style="width:100%;">Create account</button>
          </form>
        </div>
 
        ${showGuestOption ? `
        <div class="demo-note" style="margin-top:20px; text-align:center;">
          Just want to check out without an account?
          <button class="btn btn-ghost" data-guest-btn style="margin-top:10px; width:100%;">Continue as guest</button>
          <p class="field-note">Guest orders are tied to this browser only — if you clear your cookies or switch devices, you won't be able to see them again. Create an account instead if you want your order history to stick around.</p>
        </div>` : ""}
      </div>`;
  }
 
  function wireAuthTabs(container, onSuccess){
    container.querySelectorAll(".account-tabs button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        container.querySelectorAll(".account-tabs button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        const isLogin = btn.dataset.tab === "login";
        container.querySelector("[data-panel-login]").style.display = isLogin ? "block" : "none";
        container.querySelector("[data-panel-signup]").style.display = isLogin ? "none" : "block";
        container.querySelectorAll(".loginbtn").forEach(b=>b.style.paddingLeft = isLogin ? "44.6%" : "38.1%");
      });
    });
 
    container.querySelector("[data-login-form]").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const email = container.querySelector("#login-email").value;
      const password = container.querySelector("#login-password").value;
      const wasGuest = await getCurrentUser();
      const guestId = wasGuest && wasGuest.isGuest ? wasGuest.id : null;
      const res = await login(email, password);
      const err = container.querySelector("[data-login-error]");
      if(res.ok){
        if(guestId) await claimGuestOrders(guestId);
        showToast(guestId ? "Welcome back! Your guest orders were added to your account." : "Welcome back!");
        await renderHeader();
        onSuccess();
      } else {
        err.textContent = res.error;
        err.classList.add("show");
      }
    });
 
    container.querySelector("[data-signup-form]").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const name = container.querySelector("#signup-name").value.trim();
      const email = container.querySelector("#signup-email").value;
      const password = container.querySelector("#signup-password").value;
      const wasGuest = await getCurrentUser();
      const guestId = wasGuest && wasGuest.isGuest ? wasGuest.id : null;
      const res = await signup(name, email, password);
      const err = container.querySelector("[data-signup-error]");
      if(res.ok){
        if(guestId) await claimGuestOrders(guestId);
        showToast("Account created — check your email to confirm it, if confirmation is enabled on your project.");
        await renderHeader();
        onSuccess();
      } else {
        err.textContent = res.error;
        err.classList.add("show");
      }
    });
 
    const guestBtn = container.querySelector("[data-guest-btn]");
    if(guestBtn){
      guestBtn.addEventListener("click", async ()=>{
        const res = await continueAsGuest();
        if(res.ok){
          showToast("Continuing as guest");
          await renderHeader();
          onSuccess();
        } else {
          showToast(res.error);
        }
      });
    }
  }
 
  function renderLoggedOut(){
    document.querySelector("[data-title]").textContent = "Log in or create an account";
    document.querySelector("[data-subtitle]").textContent = "Track orders and skip re-typing your address next time.";
    root.innerHTML = authTabsHTML(false);
    wireAuthTabs(root, ()=>{ location.href = nextUrl; });
  }
 
  async function renderLoggedIn(user){
    document.querySelector("[data-title]").textContent = user.isGuest ? "You're checking out as a guest" : "Welcome back, " + user.name.split(" ")[0];
    document.querySelector("[data-subtitle]").textContent = user.isGuest ? "This order history only lives in this browser." : user.email;
    console.log(user);
    const orders = await ordersForCurrentUser();
    console.log(orders);
 
    root.innerHTML = `
      <div class="account-dashboard">
        <div class="account-side">
          <h3>${user.name}</h3>
          ${user.isGuest ? `<p class="field-note" style="margin-bottom:16px;">Guest session &mdash; not saved permanently.</p>` : `<p>${user.email}</p>`}
          ${user.isGuest ? `<button class="btn btn-ghost" data-show-auth style="margin-bottom:10px; width:100%;">Sign up / Log in</button>` : ""}
          ${user.isGuest ? "" : `<a href="index.html"><button class="btn btn-ghost" data-logout>Log out</button></a>`}
        </div>
        <div>
          ${user.isGuest ? `
          <div class="auth-panel" data-guest-auth-wrap style="margin-bottom:26px; display:none;">
            <h3>Keep this order history for good</h3>
            <p class="form-sub">Sign up, or log into an account you already have &mdash; either way, this order history comes with you.</p>
            <div data-guest-auth-slot></div>
          </div>` : ""}
          <h2 style="font-size:1.3rem; margin-bottom:16px;">Order history</h2>
          <div data-orders-list></div>
        </div>
      </div>`;
 
    if(user.isGuest){
      const wrap = document.querySelector("[data-guest-auth-wrap]");
      const slot = document.querySelector("[data-guest-auth-slot]");
      let wired = false;
      document.querySelector("[data-show-auth]").addEventListener("click", ()=>{
        const opening = wrap.style.display === "none";
        wrap.style.display = opening ? "block" : "none";
        if(opening && !wired){
          slot.innerHTML = authTabsHTML(false);
          wireAuthTabs(slot, ()=>{ renderAccountPage(); });
          wired = true;
        }
      });
    }
 
    const list = document.querySelector("[data-orders-list]");
    if(!orders.length){
      console.log("No orders found for user:", user);
      list.innerHTML = `<div class="empty-cart" style="padding:40px 20px;">
        <h3>No orders yet</h3>
        <p style="color: var(--bottle); margin-bottom:20px;">Once you check out, your orders will show up here.</p>
        <a href="products.html" class="btn btn-primary">Shop products</a>
      </div>`;
    } else {
      console.log("Orders found for user:", user, orders);
      list.innerHTML = orders.map(o=>`
        <div class="order-card">
          <div class="order-card__head">
            <div>
              <div class="order-card__id">Order ${o.id}</div>
              <div class="order-card__meta">${new Date(o.created_at).toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"})}</div>
            </div>
            <span class="order-status">${o.status}</span>
          </div>
          ${o.items.map(i=>`
            <div class="order-line">
              <span class="order-line__name">${i.name} &times; ${i.qty}</span>
              <span>${money(i.price * i.qty)}</span>
            </div>`).join("")}
          <div class="summary-row total"><span>Total</span><span>${money(o.total)}</span></div>
        </div>
      `).join("");
    }


    document.querySelector("[data-logout]").addEventListener("click", async ()=>{
      await logout();
      await renderHeader();
      await renderAccountPage();
    });
  }
 
  async function renderAccountPage(){
    const user = await getCurrentUser();
    if(user) renderLoggedIn(user);
    else renderLoggedOut();
  }
 
  await renderAccountPage();
})();
</script>


</body>
</html>
